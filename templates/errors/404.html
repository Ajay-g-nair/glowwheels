{% extends 'base.html' %}

{% block title %}Page Not Found - {{ config.BRAND_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-20 px-4 text-center">
    <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 text-cyan-400 flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 class="text-4xl font-black text-white">404</h1>
    <h2 class="text-lg font-bold text-slate-300 mt-2">Page Not Found</h2>
    <p class="text-xs text-slate-400 mt-2 mb-6">The doorstep mobile car wash page you were looking for doesn't exist or has moved.</p>
    <a href="{{ url_for('user.index') }}" class="px-6 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs shadow transition">
        Return to Home
    </a>
</div>
{% endblock %}
