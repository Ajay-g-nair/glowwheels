{% extends 'base.html' %}

{% block title %}Admin Portal Login - {{ config.BRAND_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-14 px-4">
    <!-- Dedicated Admin Login Card (No credentials displayed on screen) -->
    <div class="bg-forest-900 border border-forest-800 rounded-3xl p-8 shadow-2xl relative">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-forest-850 border border-gold-500/40 text-gold-400 flex items-center justify-center mx-auto mb-3 text-lg">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-2xl font-serif font-bold text-white">Admin Management Portal</h2>
            <p class="text-xs text-slate-400 mt-1">Authorized Executive Access Only</p>
        </div>

        <form method="POST" action="{{ url_for('auth.admin_login') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-cream-200 mb-1.5">Admin Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-user-shield text-xs text-gold-400"></i>
                    </span>
                    <input type="text" name="username" required autocomplete="username"
                           class="w-full bg-forest-950 border border-forest-800 focus:border-gold-400 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-600 outline-none transition"
                           placeholder="Enter admin ID">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-cream-200 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-lock text-xs text-gold-400"></i>
                    </span>
                    <input type="password" name="password" required autocomplete="current-password"
                           class="w-full bg-forest-950 border border-forest-800 focus:border-gold-400 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-600 outline-none transition"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-3 rounded-xl gold-btn text-forest-950 font-bold text-xs tracking-wide shadow-lg transition-all mt-4">
                Access Admin Dashboard
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-forest-800 text-center text-xs text-slate-500">
            Protected area. All actions are logged and audited.
        </div>
    </div>
</div>
{% endblock %}
