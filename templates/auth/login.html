{% extends 'base.html' %}

{% block title %}Login - {{ config.BRAND_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-14 px-4">
    <!-- Card matching Screen #4 from design mockup -->
    <div class="bg-forest-900 border border-forest-800 rounded-3xl p-8 shadow-2xl relative">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-forest-850 border border-gold-500/30 text-gold-400 flex items-center justify-center mx-auto mb-3 text-lg">
                <i class="fa-solid fa-user"></i>
            </div>
            <h2 class="text-2xl font-serif font-bold text-white">Welcome Back</h2>
            <p class="text-xs text-slate-400 mt-1">Login to continue booking your car wash</p>
        </div>

        <!-- Customer Login Form -->
        <form method="POST" action="{{ url_for('auth.login', next=next) }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-cream-200 mb-1.5">Phone Number / Username / Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-regular fa-user text-xs text-gold-400"></i>
                    </span>
                    <input type="text" name="login_input" required 
                           class="w-full bg-forest-950 border border-forest-800 focus:border-gold-400 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-600 outline-none transition"
                           placeholder="Enter phone or username">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-cream-200 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-lock text-xs text-gold-400"></i>
                    </span>
                    <input type="password" name="password" required 
                           class="w-full bg-forest-950 border border-forest-800 focus:border-gold-400 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-600 outline-none transition"
                           placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked class="rounded border-forest-800 text-gold-500 focus:ring-0">
                    <span>Remember me</span>
                </label>
                <a href="#" class="text-gold-400 hover:underline">Forgot Password?</a>
            </div>

            <button type="submit" 
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-forest-800 to-forest-700 hover:border-gold-400 border border-forest-600 text-white font-bold text-xs tracking-wide shadow-lg transition-all mt-2">
                Login
            </button>

            <!-- Divider -->
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-forest-800"></div>
                <span class="flex-shrink mx-3 text-[10px] uppercase text-slate-500 font-semibold tracking-wider">or</span>
                <div class="flex-grow border-t border-forest-800"></div>
            </div>

            <!-- Social Login Button style from mockup -->
            <button type="button" class="w-full py-2.5 rounded-xl bg-forest-950 border border-forest-800 hover:border-slate-700 text-cream-200 text-xs font-semibold flex items-center justify-center gap-2 transition">
                <i class="fa-brands fa-google text-red-400"></i>
                <span>Continue with Google</span>
            </button>
        </form>

        <!-- Register Link & Worker Portal Link -->
        <div class="mt-6 pt-6 border-t border-forest-800 text-center text-xs text-slate-400 space-y-3">
            <div>
                Don't have an account? 
                <a href="{{ url_for('auth.register_user') }}" class="text-gold-400 font-bold hover:underline ml-1">Sign Up</a>
            </div>
            <div class="pt-2 border-t border-forest-800/60">
                <a href="{{ url_for('auth.worker_login') }}" class="text-cream-200 hover:text-gold-400 font-semibold inline-flex items-center gap-1.5 text-xs bg-forest-950/80 px-3.5 py-2 rounded-xl border border-forest-800 hover:border-gold-500/40 transition">
                    <i class="fa-solid fa-screwdriver-wrench text-gold-400"></i>
                    <span>Are you a Field Specialist? Worker Portal &rarr;</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
