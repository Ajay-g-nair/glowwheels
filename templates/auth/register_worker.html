{% extends 'base.html' %}

{% block title %}Worker Onboarding - {{ config.BRAND_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 px-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-id-badge"></i>
            </div>
            <h2 class="text-2xl font-black text-white">Join GlowWheels Team</h2>
            <p class="text-xs text-slate-400 mt-1">Car Wash Specialist & Detailer Registration</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register_worker') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Full Name</label>
                <input type="text" name="full_name" required placeholder="e.g. Ramesh Patel"
                       class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Worker Username / Staff ID</label>
                <input type="text" name="username" required placeholder="Choose a worker username"
                       class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Mobile Phone (WhatsApp Active)</label>
                <input type="tel" name="phone" required placeholder="9876543210"
                       class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email (Optional)</label>
                <input type="email" name="email" placeholder="worker@glowwheels.com"
                       class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Create Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Confirm Password</label>
                <input type="password" name="confirm_password" required placeholder="••••••••"
                       class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none transition">
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-sm shadow-lg shadow-emerald-500/20 transition-all mt-4">
                Register as Worker
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
            Already registered as staff? 
            <a href="{{ url_for('auth.login', role='worker') }}" class="text-emerald-400 font-semibold hover:underline">Worker Login here</a>
        </div>
    </div>
</div>
{% endblock %}
